<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinesentials Admin</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
.admin-container{
max-width:1200px;
margin:40px auto;
padding:20px;
}

.admin-card{
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.login-form{
max-width:450px;
margin:auto;
}

.login-form input{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:12px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:12px;
border-bottom:1px solid #e5e7eb;
text-align:left;
}

th{
background:#f8fafc;
}

.hidden{
display:none;
}
</style>

</head>
<body>

<div class="admin-container">

<!-- LOGIN -->

<div id="loginSection" class="admin-card">

<h1>Admin Login</h1>
<p style="margin-bottom:20px;">
Sign in to view bookings.
</p>

<form id="loginForm" class="login-form">

<input
type="email"
id="email"
placeholder="Email"
required

>

<input
type="password"
id="password"
placeholder="Password"
required

>

<button
type="submit"
class="primary-btn"
style="width:100%;"

>

Login </button>

</form>

</div>

<!-- DASHBOARD -->

<div id="dashboardSection" class="admin-card hidden">

<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
<h1>Sinesentials Bookings</h1>

<button
id="logoutBtn"
class="secondary-btn"

>

Logout </button>

</div>

<table>

<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Email</th>
<th>Service</th>
<th>Date</th>
<th>Location</th>
<th>Status</th>
</tr>
</thead>

<tbody id="bookingsBody">
</tbody>

</table>

</div>

</div>

<script>

const supabaseUrl =
"https://wvcvzcjkipfxxklxehab.supabase.co";

const supabaseKey =
"PASTE_YOUR_ANON_KEY_HERE";

const supabaseClient =
supabase.createClient(
supabaseUrl,
supabaseKey
);

const loginSection =
document.getElementById("loginSection");

const dashboardSection =
document.getElementById("dashboardSection");

async function checkSession(){

const {
data:{session}
}
=
await supabaseClient.auth.getSession();

if(session){

loginSection.classList.add("hidden");

dashboardSection.classList.remove("hidden");

loadBookings();

}else{

loginSection.classList.remove("hidden");

dashboardSection.classList.add("hidden");

}

}

document
.getElementById("loginForm")
.addEventListener(
"submit",
async (e)=>{

e.preventDefault();

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const { error } =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){

alert(error.message);
return;

}

checkSession();

});

async function loadBookings(){

const { data, error } =
await supabaseClient
.from("bookings")
.select("*")
.order("created_at",{ascending:false});

if(error){

alert(error.message);
return;

}

const body =
document.getElementById("bookingsBody");

body.innerHTML = "";

if(!data.length){

body.innerHTML =
"<tr><td colspan='7'>No bookings found.</td></tr>";

return;

}

data.forEach(booking=>{

body.innerHTML += `
<tr>
<td>${booking.full_name || ""}</td>
<td>${booking.phone || ""}</td>
<td>${booking.email || ""}</td>
<td>${booking.service || ""}</td>
<td>${booking.booking_date || ""}</td>
<td>${booking.location || ""}</td>
<td>${booking.status || "Pending"}</td>
</tr>
`;

});

}

document
.getElementById("logoutBtn")
.addEventListener(
"click",
async ()=>{

await supabaseClient.auth.signOut();

checkSession();

});

checkSession();

</script>

</body>
</html>
