<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinesentials Admin Dashboard</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
.admin-container{
  max-width:1200px;
  margin:40px auto;
  padding:20px;
}

.admin-card{
  background:#ffffff;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.login-form{
  max-width:450px;
  margin:auto;
}

.login-form input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border:1px solid #dcdcdc;
  border-radius:12px;
  font-size:15px;
  box-sizing:border-box;
}

.login-btn{
  width:100%;
  padding:15px;
  background:#1f72d8;
  color:white;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.login-btn:hover{
  opacity:.95;
}

.dashboard-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.logout-btn{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,
td{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
}

th{
  background:#f8fafc;
}

@media (max-width:768px){

  table{
    display:block;
    overflow-x:auto;
  }

}
</style>

</head>
<body>

<div class="admin-container">

  <div id="loginSection" class="admin-card">

<h1>Admin Login</h1>

<p style="margin-bottom:20px;">
  Sign in to view bookings.
</p>

<form id="loginForm" class="login-form">

  <input
    type="email"
    id="email"
    placeholder="Email"
    required
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    required
  >

  <button
    type="submit"
    class="login-btn"
  >
    Login
  </button>

</form>
    

  </div>

  <div
    id="dashboardSection"
    class="admin-card"
    style="display:none;"
  >

<div class="dashboard-header">

  <h1>Sinesentials Bookings</h1>

  <button
    id="logoutBtn"
    class="logout-btn"
  >
    Logout
  </button>

</div>

<table>

  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Email</th>
      <th>Service</th>
      <th>Date</th>
      <th>Location</th>
      <th>Status</th>
    </tr>
  </thead>

  <tbody id="bookingsBody">
  </tbody>

</table>
    

  </div>

</div>

<script>

const supabaseUrl =
"https://wvcvzcjkipfxxklxehab.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2Y3Z6Y2praXBmeHhrbHhlaGFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDU1MjksImV4cCI6MjA5NjU4MTUyOX0.kdSIc2QlADnuiO8gcMJp6joISy97Lc56QH46R6C0z3g";

const supabaseClient =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const loginSection =
document.getElementById("loginSection");

const dashboardSection =
document.getElementById("dashboardSection");

async function checkSession() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if(session){

    loginSection.style.display = "none";
    dashboardSection.style.display = "block";

    await loadBookings();

  } else {

    loginSection.style.display = "block";
    dashboardSection.style.display = "none";

  }

}

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  const { error } =
  await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){

    alert(error.message);
    return;

  }

  loginSection.style.display = "none";
  dashboardSection.style.display = "block";

  await loadBookings();

});

async function loadBookings(){

  const { data, error } =
  await supabaseClient
  .from("bookings")
  .select("*")
  .order("created_at", {
    ascending: false
  });

  if(error){

    alert(error.message);
    return;

  }

  const body =
  document.getElementById("bookingsBody");

  body.innerHTML = "";

  if(!data || data.length === 0){

    body.innerHTML =
    "<tr><td colspan='7'>No bookings found.</td></tr>";

    return;

  }

data.forEach((booking)=>{

  body.innerHTML += `
    <tr>
      <td>${booking.full_name || ""}</td>
      <td>${booking.phone || ""}</td>
      <td>${booking.email || ""}</td>
      <td>${booking.service || ""}</td>
      <td>${booking.booking_date || ""}</td>
      <td>${booking.location || ""}</td>

      <td>
        <select onchange="updateStatus(${booking.id}, this.value)">
          <option value="Pending" ${booking.status==="Pending"?"selected":""}>Pending</option>
          <option value="Accepted" ${booking.status==="Accepted"?"selected":""}>Accepted</option>
          <option value="Completed" ${booking.status==="Completed"?"selected":""}>Completed</option>
          <option value="Cancelled" ${booking.status==="Cancelled"?"selected":""}>Cancelled</option>
        </select>
      </td>

    </tr>
  `;

});

}

document
.getElementById("logoutBtn")
.addEventListener("click", async function(){

  await supabaseClient.auth.signOut();

  loginSection.style.display = "block";
  dashboardSection.style.display = "none";

});
  async function updateStatus(id, status){

  const { error } =
  await supabaseClient
  .from("bookings")
  .update({ status })
  .eq("id", id);

  if(error){
    alert(error.message);
    return;
  }

  alert("Status updated");
}
  

checkSession();

</script>

</body>
</html>
