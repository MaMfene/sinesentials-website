<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sinesentials Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="page-main">

<h1>Sinesentials Bookings</h1>

<br>

<button id="logoutBtn" class="secondary-btn">
Logout
</button>

<br><br>

<div class="booking-card">

<table style="width:100%;border-collapse:collapse;">

<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Service</th>
<th>Date</th>
<th>Status</th>
</tr>
</thead>

<tbody id="bookingsBody">
</tbody>

</table>

</div>

</div>

<script>

const supabaseUrl =
"https://wvcvzcjkipfxxklxehab.supabase.co";

const supabaseKey =
"const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2Y3Z6Y2praXBmeHhrbHhlaGFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDU1MjksImV4cCI6MjA5NjU4MTUyOX0.kdSIc2QlADnuiO8gcMJp6joISy97Lc56QH46R6C0z3g";";

const supabaseClient =
supabase.createClient(
supabaseUrl,
supabaseKey
);

async function checkAuth(){

const {
data: { session }
}
=
await supabaseClient.auth.getSession();

if(!session){
window.location.href =
"admin-login.html";
return;
}

loadBookings();

}

async function loadBookings(){

const { data, error } =
await supabaseClient
.from("bookings")
.select("*")
.order("created_at", {
ascending:false
});

if(error){
console.error(error);
return;
}

const body =
document.getElementById(
"bookingsBody"
);

body.innerHTML = "";

data.forEach(booking => {

body.innerHTML += `
<tr>
<td>${booking.full_name}</td>
<td>${booking.phone}</td>
<td>${booking.service}</td>
<td>${booking.booking_date || ""}</td>
<td>${booking.status}</td>
</tr>
`;

});

}

document
.getElementById("logoutBtn")
.addEventListener("click", async () => {

await supabaseClient.auth.signOut();

window.location.href =
"admin-login.html";

});

checkAuth();

</script>

</body>
</html>
